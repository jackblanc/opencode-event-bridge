# Lefthook configuration for pre-commit hooks
# https://lefthook.dev/configuration/

pre-commit:
  parallel: true
  jobs:
    - name: lint
      glob: "*.{ts,tsx,js,jsx}"
      run: pnpm exec oxlint --fix {staged_files}
      stage_fixed: true

    - name: format
      glob: "*.{ts,tsx,js,jsx,json,md,yml,yaml,css}"
      run: pnpm exec oxfmt --write {staged_files}
      stage_fixed: true

    - name: typecheck
      glob: "*.{ts,tsx}"
      run: pnpm run typecheck

    - name: knip
      run: pnpm run knip

    - name: test:unit
      run: pnpm run test:unit
